<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#765747">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revenda">
<link rel="apple-touch-icon" href="icon.png">

<title>Revenda</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

:root{
  --bg:#f7f2ed;
  --card:#fffdfb;
  --brown:#765747;
  --brown2:#a88976;
  --text:#3e312a;
  --muted:#927e70;
  --line:#e9ddd5;
  --soft:#eee3dc;
  --green:#52755b;
  --red:#a35353;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",Arial,sans-serif;
  padding-bottom:95px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  padding:20px 16px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  font-family:"Playfair Display",serif;
  font-size:31px;
  color:var(--brown);
  margin:0;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--card);
  color:var(--brown);
  box-shadow:0 4px 15px rgba(80,50,30,.06);
  font-size:18px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  box-shadow:0 6px 20px rgba(80,50,30,.04);
}

.metric{
  min-height:110px;
}

.metric-label{
  color:var(--muted);
  font-size:12px;
  margin-bottom:9px;
}

.metric-value{
  font-size:22px;
  font-weight:700;
}

.green{
  color:var(--green);
}

.red{
  color:var(--red);
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 0 12px;
}

.section-title h2{
  font-family:"Playfair Display",serif;
  font-size:21px;
  margin:0;
}

.small{
  color:var(--muted);
  font-size:12px;
}

.primary{
  width:100%;
  background:var(--brown);
  color:white;
  border-radius:15px;
  padding:14px;
  font-weight:700;
  margin-top:10px;
}

.secondary{
  background:var(--soft);
  color:var(--brown);
  border-radius:12px;
  padding:10px 12px;
  font-weight:600;
}

.danger{
  background:#f4e3e1;
  color:var(--red);
  border-radius:12px;
  padding:10px 12px;
  font-weight:600;
}

.form{
  display:grid;
  gap:12px;
}

label{
  font-size:12px;
  color:var(--muted);
  font-weight:600;
}

input,select{
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:13px;
  padding:13px;
  color:var(--text);
  outline:none;
}

input:focus,select:focus{
  border-color:var(--brown2);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.product{
  margin-bottom:12px;
}

.product-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.product-name{
  font-weight:700;
  font-size:16px;
}

.product-info{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
  line-height:1.6;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.actions button{
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  background:var(--soft);
  color:var(--brown);
  font-size:11px;
  font-weight:700;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 10px;
  font-size:13px;
}

.sale-row{
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.sale-row:last-child{
  border-bottom:0;
}

.sale-main{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.sale-name{
  font-weight:700;
}

.sale-details{
  color:var(--muted);
  font-size:12px;
  margin-top:5px;
}

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  background:rgba(255,253,251,.96);
  border-top:1px solid var(--line);
  padding:9px max(10px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));
  display:flex;
  justify-content:center;
}

.nav-inner{
  width:min(760px,100%);
  display:grid;
  grid-template-columns:repeat(5,1fr);
}

.nav-btn{
  background:none;
  color:var(--muted);
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:4px;
}

.nav-btn span{
  font-size:20px;
}

.nav-btn.active{
  color:var(--brown);
  font-weight:700;
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.list-item:last-child{
  border-bottom:0;
}

.list-title{
  font-weight:700;
  font-size:14px;
}

.list-sub{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.chart{
  height:180px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding-top:15px;
}

.bar-wrap{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
}

.bar{
  width:100%;
  max-width:34px;
  background:var(--brown2);
  border-radius:8px 8px 3px 3px;
  min-height:3px;
}

.bar-label{
  font-size:9px;
  color:var(--muted);
}

.bar-value{
  font-size:8px;
  color:var(--text);
}

.rank{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
}

.rank:last-child{
  border-bottom:0;
}

.rank-number{
  width:28px;
  height:28px;
  border-radius:50%;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:12px;
}

.rank-info{
  flex:1;
}

.rank-name{
  font-weight:700;
  font-size:13px;
}

.rank-sub{
  color:var(--muted);
  font-size:11px;
}

.rank-profit{
  font-weight:700;
  color:var(--green);
  font-size:12px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(55,40,30,.42);
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border-radius:25px 25px 0 0;
  padding:20px 16px calc(25px + env(safe-area-inset-bottom));
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-title{
  font-family:"Playfair Display",serif;
  font-size:22px;
  margin:0;
}

.close{
  width:35px;
  height:35px;
  border-radius:50%;
  background:var(--soft);
  color:var(--brown);
}

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%);
  background:var(--text);
  color:white;
  padding:11px 15px;
  border-radius:12px;
  font-size:12px;
  z-index:200;
  display:none;
}

.toast.show{
  display:block;
}

@media(min-width:650px){
  .grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1 class="logo">Revenda</h1>
    <div class="subtitle">A tua gestão de vendas 🤎</div>
  </div>

  <button class="icon-btn" onclick="showPage('mais')">⋯</button>
</header>

<!-- INÍCIO -->
<section id="inicio" class="page active">

  <div class="grid">

    <div class="card metric">
      <div class="metric-label">Investido</div>
      <div class="metric-value" id="mInvestido">0,00 €</div>
    </div>

    <div class="card metric">
      <div class="metric-label">Recebido</div>
      <div class="metric-value" id="mRecebido">0,00 €</div>
    </div>

    <div class="card metric">
      <div class="metric-label">Lucro</div>
      <div class="metric-value green" id="mLucro">0,00 €</div>
    </div>

    <div class="card metric">
      <div class="metric-label">Gastos</div>
      <div class="metric-value red" id="mGastos">0,00 €</div>
    </div>

    <div class="card metric">
      <div class="metric-label">Em stock</div>
      <div class="metric-value" id="mStock">0</div>
    </div>

    <div class="card metric">
      <div class="metric-label">Vendidos</div>
      <div class="metric-value" id="mVendidos">0</div>
    </div>

  </div>

  <div class="section-title">
    <h2>Produtos mais vendidos</h2>
  </div>

  <div class="card" id="ranking"></div>

  <div class="section-title">
    <h2>Receitas</h2>
  </div>

  <div class="card">
    <div class="chart" id="revenueChart"></div>
  </div>

</section>


<!-- PRODUTOS -->
<section id="produtos" class="page">

  <div class="section-title">
    <h2>Produtos</h2>
    <button class="secondary" onclick="openProductModal()">＋ Produto</button>
  </div>

  <div id="productsList"></div>

</section>


<!-- VENDA -->
<section id="venda" class="page">

  <div class="section-title">
    <h2>Registar venda</h2>
  </div>

  <div class="card">

    <form class="form" onsubmit="saveSale(event)">

      <input type="hidden" id="saleId">

      <div>
        <label>Produto</label>
        <select id="saleProduct" required onchange="updateSaleStockHint()"></select>
        <div class="small" id="saleStockHint"></div>
      </div>

      <div class="row">

        <div>
          <label>Quantidade</label>
          <input id="saleQty" type="number" min="1" step="1" value="1" required>
        </div>

        <div>
          <label>Preço de venda (€)</label>
          <input id="salePrice" type="number" min="0" step="0.01" required>
        </div>

      </div>

      <div class="row">

        <div>
          <label>Gastos desta venda (€)</label>
          <input id="saleCosts" type="number" min="0" step="0.01" value="0">
        </div>

        <div>
          <label>Estado</label>
          <select id="saleStatus">
            <option value="pago">Pago</option>
            <option value="pendente">Pendente</option>
          </select>
        </div>

      </div>

      <button class="primary" id="saleSubmit">Registar venda</button>

    </form>

  </div>

  <div class="section-title">
    <h2>Histórico</h2>
  </div>

  <div class="card" id="salesList"></div>

</section>


<!-- COMPRAS -->
<section id="compras" class="page">

  <div class="section-title">
    <h2>Lista de compras</h2>
  </div>

  <div class="card" id="shoppingList"></div>

</section>


<!-- MAIS -->
<section id="mais" class="page">

  <div class="section-title">
    <h2>Mais</h2>
  </div>

  <div class="card">

    <button class="secondary" style="width:100%;margin-bottom:8px" onclick="exportBackup()">
      💾 Exportar backup
    </button>

    <button class="secondary" style="width:100%;margin-bottom:8px" onclick="document.getElementById('importFile').click()">
      📥 Importar backup
    </button>

    <input type="file" id="importFile" accept=".json" hidden onchange="importBackup(event)">

    <button class="danger" style="width:100%" onclick="resetAll()">
      🗑️ Apagar todos os dados
    </button>

  </div>

  <div class="section-title">
    <h2>Despesas</h2>
    <button class="secondary" onclick="openExpenseModal()">＋ Despesa</button>
  </div>

  <div class="card" id="expensesList"></div>

</section>

</div>


<!-- NAVEGAÇÃO -->
<nav class="bottom-nav">
  <div class="nav-inner">

    <button class="nav-btn active" data-page="inicio" onclick="showPage('inicio')">
      <span>⌂</span>
      Início
    </button>

    <button class="nav-btn" data-page="produtos" onclick="showPage('produtos')">
      <span>▣</span>
      Produtos
    </button>

    <button class="nav-btn" data-page="venda" onclick="showPage('venda')">
      <span>＋</span>
      Venda
    </button>

    <button class="nav-btn" data-page="compras" onclick="showPage('compras')">
      <span>🛒</span>
      Compras
    </button>

    <button class="nav-btn" data-page="mais" onclick="showPage('mais')">
      <span>•••</span>
      Mais
    </button>

  </div>
</nav>


<!-- MODAL PRODUTO -->
<div class="modal" id="productModal">
  <div class="modal-box">

    <div class="modal-head">
      <h2 class="modal-title" id="productModalTitle">Novo produto</h2>
      <button class="close" onclick="closeModal('productModal')">×</button>
    </div>

    <form class="form" onsubmit="saveProduct(event)">

      <input type="hidden" id="productId">

      <div>
        <label>Nome do produto</label>
        <input id="productName" placeholder="Ex.: Rosa eterna" required>
      </div>

      <div class="row">

        <div>
          <label>Preço de compra (€)</label>
          <input id="productCost" type="number" min="0" step="0.01" required>
        </div>

        <div>
          <label>Preço de venda (€)</label>
          <input id="productTarget" type="number" min="0" step="0.01" required>
        </div>

      </div>

      <div>
        <label>Quantidade em stock</label>
        <input id="productStock" type="number" min="0" step="1" value="1" required>
      </div>

      <button class="primary">Guardar produto</button>

    </form>

  </div>
</div>


<!-- MODAL DESPESA -->
<div class="modal" id="expenseModal">
  <div class="modal-box">

    <div class="modal-head">
      <h2 class="modal-title">Despesa</h2>
      <button class="close" onclick="closeModal('expenseModal')">×</button>
    </div>

    <form class="form" onsubmit="saveExpense(event)">

      <input type="hidden" id="expenseId">

      <div>
        <label>Descrição</label>
        <input id="expenseDesc" placeholder="Ex.: Embalagens" required>
      </div>

      <div class="row">

        <div>
          <label>Valor (€)</label>
          <input id="expenseAmount" type="number" min="0" step="0.01" required>
        </div>

        <div>
          <label>Categoria</label>
          <input id="expenseCat" placeholder="Ex.: Material">
        </div>

      </div>

      <button class="primary">Guardar despesa</button>

    </form>

  </div>
</div>


<div class="toast" id="toast"></div>


<script>

const STORAGE_KEY = "revenda_complete_v2";

let db = loadDB();

function emptyDB(){
  return {
    products:[],
    sales:[],
    expenses:[],
    shopping:{}
  };
}

function loadDB(){

  try{

    const saved = localStorage.getItem(STORAGE_KEY);

    if(saved){
      return normalizeDB(JSON.parse(saved));
    }

    // compatibilidade com versões anteriores
    const old = localStorage.getItem("revenda_complete_v1");

    if(old){
      return normalizeDB(JSON.parse(old));
    }

  }catch(e){
    console.error(e);
  }

  return emptyDB();
}

function normalizeDB(data){

  data = data || {};

  return {
    products:Array.isArray(data.products) ? data.products : [],
    sales:Array.isArray(data.sales) ? data.sales : [],
    expenses:Array.isArray(data.expenses) ? data.expenses : [],
    shopping:data.shopping && typeof data.shopping === "object" ? data.shopping : {}
  };
}

function saveDB(){

  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));

  ensureShopping();

}

function uid(){

  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);

}

function money(value){

  return Number(value || 0).toLocaleString("pt-PT",{
    style:"currency",
    currency:"EUR"
  });

}

function dateFormat(date){

  return new Date(date).toLocaleDateString("pt-PT");

}

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);

}

function showPage(page){

  document.querySelectorAll(".page").forEach(el=>{
    el.classList.remove("active");
  });

  document.getElementById(page).classList.add("active");

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });

  renderAll();

  window.scrollTo({top:0,behavior:"smooth"});

}

function openModal(id){

  document.getElementById(id).classList.add("show");

}

function closeModal(id){

  document.getElementById(id).classList.remove("show");

}

function invested(){

  return db.products.reduce((total,p)=>{
    return total + Number(p.cost||0)*Number(p.totalBought||0);
  },0);

}

function revenue(){

  return db.sales.reduce((total,s)=>{
    return total + Number(s.price||0)*Number(s.qty||0);
  },0);

}

function costOfSold(){

  return db.sales.reduce((total,s)=>{

    const p=db.products.find(x=>x.id===s.productId);

    return total+(p ? Number(p.cost||0)*Number(s.qty||0):0);

  },0);

}

function saleCosts(){

  return db.sales.reduce((total,s)=>{
    return total+Number(s.costs||0);
  },0);

}

function generalCosts(){

  return db.expenses.reduce((total,e)=>{
    return total+Number(e.amount||0);
  },0);

}

function totalCosts(){

  return saleCosts()+generalCosts();

}

function profit(){

  return revenue()-costOfSold()-totalCosts();

}

function soldQty(){

  return db.sales.reduce((total,s)=>{
    return total+Number(s.qty||0);
  },0);

}

function stockQty(){

  return db.products.reduce((total,p)=>{
    return total+Number(p.stock||0);
  },0);

}

function ensureShopping(){

  let changed=false;

  db.products.forEach(p=>{

    if(Number(p.stock)<=0){

      if(!db.shopping[p.id]){
        db.shopping[p.id]=1;
        changed=true;
      }

    }else{

      if(db.shopping[p.id]){
        delete db.shopping[p.id];
        changed=true;
      }

    }

  });

  if(changed){

    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));

  }

}

function renderAll(){

  ensureShopping();

  renderMetrics();
  renderProducts();
  renderSales();
  renderShopping();
  renderExpenses();
  renderRanking();
  renderChart();
  populateSaleProducts();

}

function renderMetrics(){

  document.getElementById("mInvestido").textContent=money(invested());
  document.getElementById("mRecebido").textContent=money(revenue());
  document.getElementById("mLucro").textContent=money(profit());
  document.getElementById("mGastos").textContent=money(totalCosts());
  document.getElementById("mStock").textContent=stockQty();
  document.getElementById("mVendidos").textContent=soldQty();

}

function openProductModal(id=null){

  document.getElementById("productId").value="";
  document.getElementById("productName").value="";
  document.getElementById("productCost").value="";
  document.getElementById("productTarget").value="";
  document.getElementById("productStock").value="1";

  document.getElementById("productModalTitle").textContent="Novo produto";

  if(id){

    const p=db.products.find(x=>x.id===id);

    if(!p)return;

    document.getElementById("productId").value=p.id;
    document.getElementById("productName").value=p.name;
    document.getElementById("productCost").value=p.cost;
    document.getElementById("productTarget").value=p.target;
    document.getElementById("productStock").value=p.stock;

    document.getElementById("productModalTitle").textContent="Editar produto";

  }

  openModal("productModal");

}

function saveProduct(event){

  event.preventDefault();

  const id=document.getElementById("productId").value;

  const name=document.getElementById("productName").value.trim();

  const cost=Number(document.getElementById("productCost").value);

  const target=Number(document.getElementById("productTarget").value);

  const stock=Number(document.getElementById("productStock").value);

  if(id){

    const p=db.products.find(x=>x.id===id);

    if(p){

      p.name=name;
      p.cost=cost;
      p.target=target;
      p.stock=stock;

    }

    toast("Produto atualizado ✨");

  }else{

    db.products.push({

      id:uid(),
      name,
      cost,
      target,
      stock,
      totalBought:stock

    });

    toast("Produto adicionado 🤎");

  }

  saveDB();

  closeModal("productModal");

  renderAll();

}

function deleteProduct(id){

  const p=db.products.find(x=>x.id===id);

  if(!p)return;

  const hasSales=db.sales.some(s=>s.productId===id);

  if(hasSales){

    if(!confirm("Este produto tem vendas associadas. Queres mesmo eliminá-lo? As vendas também serão eliminadas.")){
      return;
    }

    db.sales=db.sales.filter(s=>s.productId!==id);

  }else{

    if(!confirm("Eliminar este produto?"))return;

  }

  db.products=db.products.filter(x=>x.id!==id);

  delete db.shopping[id];

  saveDB();

  renderAll();

  toast("Produto eliminado");

}

function addStock(id){

  const amount=prompt("Quantas unidades queres adicionar ao stock?","1");

  if(amount===null)return;

  const qty=Number(amount);

  if(!qty || qty<=0)return;

  const p=db.products.find(x=>x.id===id);

  if(!p)return;

  p.stock+=qty;

  p.totalBought=(p.totalBought||0)+qty;

  saveDB();

  renderAll();

  toast("Stock atualizado 📦");

}

function quickSale(id){

  showPage("venda");

  setTimeout(()=>{

    document.getElementById("saleProduct").value=id;

    updateSaleStockHint();

    const p=db.products.find(x=>x.id===id);

    if(p){

      document.getElementById("salePrice").value=p.target;

    }

  },50);

}

function renderProducts(){

  const el=document.getElementById("productsList");

  if(!db.products.length){

    el.innerHTML=`
      <div class="card empty">
        Ainda não tens produtos.<br><br>
        Adiciona o teu primeiro produto.
      </div>
    `;

    return;

  }

  el.innerHTML=db.products.map(p=>{

    const sold=db.sales
      .filter(s=>s.productId===p.id)
      .reduce((a,s)=>a+Number(s.qty||0),0);

    return `

      <div class="card product">

        <div class="product-top">

          <div>

            <div class="product-name">${escapeHTML(p.name)}</div>

            <div class="product-info">
              Compra: <b>${money(p.cost)}</b><br>
              Venda prevista: <b>${money(p.target)}</b><br>
              Stock: <b>${p.stock}</b> · Vendidos: <b>${sold}</b>
            </div>

          </div>

          <span class="badge">
            ${p.stock>0 ? "Em stock" : "Esgotado"}
          </span>

        </div>

        <div class="actions">

          <button class="primary" style="width:auto;margin:0" onclick="quickSale('${p.id}')">
            ＋ Venda
          </button>

          <button class="secondary" onclick="openProductModal('${p.id}')">
            ✏️ Editar
          </button>

          <button class="secondary" onclick="addStock('${p.id}')">
            ＋ Stock
          </button>

          <button class="danger" onclick="deleteProduct('${p.id}')">
            🗑️ Eliminar
          </button>

        </div>

      </div>

    `;

  }).join("");

}

function populateSaleProducts(){

  const select=document.getElementById("saleProduct");

  const current=select.value;

  select.innerHTML=`
    <option value="">Escolher produto...</option>
    ${db.products.map(p=>`
      <option value="${p.id}">
        ${escapeHTML(p.name)} — ${p.stock} em stock
      </option>
    `).join("")}
  `;

  if(db.products.some(p=>p.id===current)){
    select.value=current;
  }

  updateSaleStockHint();

}

function updateSaleStockHint(){

  const id=document.getElementById("saleProduct").value;

  const p=db.products.find(x=>x.id===id);

  document.getElementById("saleStockHint").textContent=
    p ? `Stock disponível: ${p.stock} · Venda prevista: ${money(p.target)}` : "";

}

function saveSale(event){

  event.preventDefault();

  const id=document.getElementById("saleId").value;

  const productId=document.getElementById("saleProduct").value;

  const qty=Number(document.getElementById("saleQty").value);

  const price=Number(document.getElementById("salePrice").value);

  const costs=Number(document.getElementById("saleCosts").value||0);

  const status=document.getElementById("saleStatus").value;

  const p=db.products.find(x=>x.id===productId);

  if(!p)return;

  if(!qty || qty<=0)return;

  if(id){

    const old=db.sales.find(s=>s.id===id);

    if(!old)return;

    const oldProduct=db.products.find(x=>x.id===old.productId);

    if(oldProduct){
      oldProduct.stock+=Number(old.qty||0);
    }

    if(p.stock<qty){

      alert("Não tens stock suficiente.");

      if(oldProduct)oldProduct.stock-=Number(old.qty||0);

      return;

    }

    p.stock-=qty;

    old.productId=productId;
    old.qty=qty;
    old.price=price;
    old.costs=costs;
    old.status=status;

    toast("Venda atualizada ✨");

  }else{

    if(p.stock<qty){

      alert(`Só tens ${p.stock} unidade(s) em stock.`);

      return;

    }

    p.stock-=qty;

    db.sales.unshift({

      id:uid(),
      productId,
      qty,
      price,
      costs,
      status,
      date:new Date().toISOString()

    });

    toast("Venda registada 💰");

  }

  saveDB();

  resetSaleForm();

  renderAll();

}

function resetSaleForm(){

  document.getElementById("saleId").value="";
  document.getElementById("saleProduct").value="";
  document.getElementById("saleQty").value=1;
  document.getElementById("salePrice").value="";
  document.getElementById("saleCosts").value=0;
  document.getElementById("saleStatus").value="pago";

  document.getElementById("saleSubmit").textContent="Registar venda";

  updateSaleStockHint();

}

function editSale(id){

  const s=db.sales.find(x=>x.id===id);

  if(!s)return;

  showPage("venda");

  document.getElementById("saleId").value=s.id;
  document.getElementById("saleProduct").value=s.productId;
  document.getElementById("saleQty").value=s.qty;
  document.getElementById("salePrice").value=s.price;
  document.getElementById("saleCosts").value=s.costs||0;
  document.getElementById("saleStatus").value=s.status||"pago";

  document.getElementById("saleSubmit").textContent="Guardar alterações";

  updateSaleStockHint();

  window.scrollTo({top:0,behavior:"smooth"});

}

function deleteSale(id){

  const s=db.sales.find(x=>x.id===id);

  if(!s)return;

  if(!confirm("Eliminar esta venda? O stock será reposto."))return;

  const p=db.products.find(x=>x.id===s.productId);

  if(p){

    p.stock+=Number(s.qty||0);

  }

  db.sales=db.sales.filter(x=>x.id!==id);

  saveDB();

  renderAll();

  toast("Venda eliminada");

}

function renderSales(){

  const el=document.getElementById("salesList");

  if(!db.sales.length){

    el.innerHTML=`<div class="empty">Ainda não tens vendas registadas.</div>`;

    return;

  }

  el.innerHTML=db.sales.map(s=>{

    const p=db.products.find(x=>x.id===s.productId);

    const name=p ? p.name : "Produto eliminado";

    const total=Number(s.price||0)*Number(s.qty||0);

    const cost=p ? Number(p.cost||0)*Number(s.qty||0):0;

    const saleProfit=total-cost-Number(s.costs||0);

    return `

      <div class="sale-row">

        <div class="sale-main">

          <div>

            <div class="sale-name">${escapeHTML(name)}</div>

            <div class="sale-details">
              ${s.qty} un. · ${money(s.price)} cada · ${dateFormat(s.date)}
              <br>
              ${s.status==="pendente" ? "⏳ Pendente" : "✓ Pago"}
            </div>

          </div>

          <div style="text-align:right">

            <b>${money(total)}</b>

            <div class="${saleProfit>=0?"green":"red"}" style="font-size:11px;margin-top:3px">
              Lucro ${money(saleProfit)}
            </div>

          </div>

        </div>

        <div class="actions">

          <button class="secondary" onclick="editSale('${s.id}')">
            ✏️ Editar
          </button>

          <button class="danger" onclick="deleteSale('${s.id}')">
            🗑️ Eliminar
          </button>

        </div>

      </div>

    `;

  }).join("");

}

function openExpenseModal(id=null){

  document.getElementById("expenseId").value="";
  document.getElementById("expenseDesc").value="";
  document.getElementById("expenseAmount").value="";
  document.getElementById("expenseCat").value="";

  if(id){

    const e=db.expenses.find(x=>x.id===id);

    if(!e)return;

    document.getElementById("expenseId").value=e.id;
    document.getElementById("expenseDesc").value=e.desc;
    document.getElementById("expenseAmount").value=e.amount;
    document.getElementById("expenseCat").value=e.cat||"";

  }

  openModal("expenseModal");

}

function saveExpense(event){

  event.preventDefault();

  const id=document.getElementById("expenseId").value;

  const desc=document.getElementById("expenseDesc").value.trim();

  const amount=Number(document.getElementById("expenseAmount").value);

  const cat=document.getElementById("expenseCat").value.trim();

  if(id){

    const e=db.expenses.find(x=>x.id===id);

    if(e){

      e.desc=desc;
      e.amount=amount;
      e.cat=cat;

    }

    toast("Despesa atualizada ✨");

  }else{

    db.expenses.unshift({

      id:uid(),
      desc,
      amount,
      cat,
      date:new Date().toISOString()

    });

    toast("Despesa adicionada");

  }

  saveDB();

  closeModal("expenseModal");

  renderAll();

}

function editExpense(id){

  openExpenseModal(id);

}

function deleteExpense(id){

  if(!confirm("Eliminar esta despesa?"))return;

  db.expenses=db.expenses.filter(x=>x.id!==id);

  saveDB();

  renderAll();

  toast("Despesa eliminada");

}

function renderExpenses(){

  const el=document.getElementById("expensesList");

  if(!db.expenses.length){

    el.innerHTML=`<div class="empty">Ainda não tens despesas.</div>`;

    return;

  }

  el.innerHTML=db.expenses.map(e=>`

    <div class="list-item">

      <div>

        <div class="list-title">${escapeHTML(e.desc)}</div>

        <div class="list-sub">
          ${escapeHTML(e.cat||"Sem categoria")} · ${dateFormat(e.date)}
        </div>

      </div>

      <div style="text-align:right">

        <b class="red">${money(e.amount)}</b>

        <div class="actions" style="justify-content:flex-end">

          <button class="secondary" onclick="editExpense('${e.id}')">✏️</button>

          <button class="danger" onclick="deleteExpense('${e.id}')">🗑️</button>

        </div>

      </div>

    </div>

  `).join("");

}

function renderShopping(){

  const el=document.getElementById("shoppingList");

  const ids=Object.keys(db.shopping)
    .filter(id=>db.products.some(p=>p.id===id));

  if(!ids.length){

    el.innerHTML=`
      <div class="empty">
        A tua lista de compras está vazia ✨
      </div>
    `;

    return;

  }

  let total=0;

  el.innerHTML=ids.map(id=>{

    const p=db.products.find(x=>x.id===id);

    let qty=Number(db.shopping[id]||1);

    if(qty<1)qty=1;

    const cost=qty*Number(p.cost||0);

    total+=cost;

    return `

      <div class="list-item">

        <div>

          <div class="list-title">${escapeHTML(p.name)}</div>

          <div class="list-sub">
            ${money(p.cost)} por unidade · Total ${money(cost)}
          </div>

        </div>

        <div style="display:flex;align-items:center;gap:5px">

          <button class="secondary" onclick="changeShopping('${id}',-1)">−</button>

          <b>${qty}</b>

          <button class="secondary" onclick="changeShopping('${id}',1)">＋</button>

        </div>

      </div>

      <div class="actions">

        <button class="primary" style="margin:0" onclick="buyShopping('${id}')">
          ✓ Comprei
        </button>

        <button class="danger" onclick="removeShopping('${id}')">
          🗑️ Remover
        </button>

      </div>

    `;

  }).join("")+

  `

    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:15px">

      <div style="display:flex;justify-content:space-between">

        <b>Total previsto</b>

        <b>${money(total)}</b>

      </div>

    </div>

  `;

}

function changeShopping(id,delta){

  if(!db.shopping[id])db.shopping[id]=1;

  db.shopping[id]=Math.max(1,Number(db.shopping[id])+delta);

  saveDB();

  renderShopping();

}

function removeShopping(id){

  delete db.shopping[id];

  saveDB();

  renderShopping();

  toast("Removido da lista");

}

function buyShopping(id){

  const p=db.products.find(x=>x.id===id);

  if(!p)return;

  const qty=Number(db.shopping[id]||1);

  p.stock+=qty;

  p.totalBought=(p.totalBought||0)+qty;

  delete db.shopping[id];

  saveDB();

  renderAll();

  toast(`${qty} unidade(s) adicionada(s) ao stock 📦`);

}

function renderRanking(){

  const el=document.getElementById("ranking");

  const map={};

  db.sales.forEach(s=>{

    if(!map[s.productId]){

      map[s.productId]={
        qty:0,
        profit:0
      };

    }

    const p=db.products.find(x=>x.id===s.productId);

    const cost=p ? Number(p.cost||0):0;

    map[s.productId].qty+=Number(s.qty||0);

    map[s.productId].profit+=
      Number(s.price||0)*Number(s.qty||0)
      -cost*Number(s.qty||0)
      -Number(s.costs||0);

  });

  const ranking=Object.entries(map)
    .map(([id,data])=>{

      const p=db.products.find(x=>x.id===id);

      return {
        id,
        name:p ? p.name:"Produto eliminado",
        ...data
      };

    })
    .sort((a,b)=>{

      if(b.qty!==a.qty)return b.qty-a.qty;

      return b.profit-a.profit;

    });

  if(!ranking.length){

    el.innerHTML=`<div class="empty">Ainda não há vendas para mostrar.</div>`;

    return;

  }

  el.innerHTML=ranking.slice(0,10).map((r,i)=>`

    <div class="rank">

      <div class="rank-number">${i+1}</div>

      <div class="rank-info">

        <div class="rank-name">${escapeHTML(r.name)}</div>

        <div class="rank-sub">
          ${r.qty} unidade(s) vendida(s)
        </div>

      </div>

      <div class="rank-profit">
        ${money(r.profit)}
      </div>

    </div>

  `).join("");

}

function renderChart(){

  const el=document.getElementById("revenueChart");

  const months=[];

  const now=new Date();

  for(let i=5;i>=0;i--){

    const d=new Date(now.getFullYear(),now.getMonth()-i,1);

    months.push({

      year:d.getFullYear(),
      month:d.getMonth(),
      label:d.toLocaleDateString("pt-PT",{month:"short"}),

      value:0

    });

  }

  db.sales.forEach(s=>{

    const d=new Date(s.date);

    const m=months.find(x=>
      x.year===d.getFullYear() &&
      x.month===d.getMonth()
    );

    if(m){

      m.value+=Number(s.price||0)*Number(s.qty||0);

    }

  });

  const max=Math.max(...months.map(x=>x.value),1);

  el.innerHTML=months.map(m=>{

    const height=Math.max(3,(m.value/max)*130);

    return `

      <div class="bar-wrap">

        <div class="bar-value">${m.value ? money(m.value).replace(" €","€") : ""}</div>

        <div class="bar" style="height:${height}px"></div>

        <div class="bar-label">${m.label}</div>

      </div>

    `;

  }).join("");

}

function exportBackup(){

  const data=JSON.stringify(db,null,2);

  const blob=new Blob([data],{
    type:"application/json"
  });

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download="backup-revenda.json";

  a.click();

  URL.revokeObjectURL(url);

  toast("Backup criado 💾");

}

function importBackup(event){

  const file=event.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{

    try{

      const imported=normalizeDB(JSON.parse(e.target.result));

      if(!confirm("Isto vai substituir os dados atuais pelos dados do backup. Continuar?")){
        return;
      }

      db=imported;

      saveDB();

      renderAll();

      toast("Backup restaurado ✨");

    }catch(err){

      alert("Não foi possível importar este backup.");

    }

  };

  reader.readAsText(file);

}

function resetAll(){

  if(!confirm("ATENÇÃO: isto vai apagar todos os produtos, vendas, despesas e compras. Continuar?")){
    return;
  }

  if(!confirm("Tens a certeza? Esta ação não pode ser desfeita sem um backup.")){
    return;
  }

  db=emptyDB();

  saveDB();

  renderAll();

  toast("Todos os dados foram apagados");

}

function escapeHTML(value){

  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

document.querySelectorAll(".modal").forEach(modal=>{

  modal.addEventListener("click",e=>{

    if(e.target===modal){
      modal.classList.remove("show");
    }

  });

});

renderAll();

</script>
  
</body>
</html>
